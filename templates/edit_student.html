<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-container">

        <h1>Edit Student</h1>

        <form method="POST">

            <div class="form-group">
                <label>Student ID</label>
                <input type="text"
                       name="student_id"
                       value="{{ student['student_id'] }}"
                       required>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text"
                       name="name"
                       value="{{ student['name'] }}"
                       required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       value="{{ student['email'] }}">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel"
                       name="phone"
                       value="{{ student['phone'] }}">
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text"
                       name="course"
                       value="{{ student['course'] }}">
            </div>

            <div class="form-group">
                <label>Year</label>
                <input type="number"
                       name="year"
                       min="1"
                       max="6"
                       value="{{ student['year'] }}">
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date"
                       name="date_of_birth"
                       value="{{ student['date_of_birth'] }}">
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text"
                       name="address"
                       value="{{ student['address'] }}">
            </div>

            <button type="submit" class="login-btn">
                Update Student
            </button>

        </form>

        <br>

        <a href="{{ url_for('students') }}">
            ← Back to Students
        </a>

    </div>

</body>

</html>
