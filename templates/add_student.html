<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-container">

        <h1>Add Student</h1>

        <form method="POST">

            <div class="form-group">
                <label>Student ID</label>
                <input type="text"
                       name="student_id"
                       placeholder="Example: STU001"
                       required>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter student name"
                       required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel"
                       name="phone"
                       placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text"
                       name="course"
                       placeholder="Example: B.Sc Computer Science">
            </div>

            <div class="form-group">
                <label>Year</label>
                <input type="number"
                       name="year"
                       min="1"
                       max="6"
                       placeholder="Example: 2">
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date"
                       name="date_of_birth">
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text"
                       name="address"
                       placeholder="Enter address">
            </div>

            <button type="submit" class="login-btn">
                Add Student
            </button>

        </form>

        <br>

        <a href="{{ url_for('students') }}">
            ← Back to Students
        </a>

    </div>

</body>

</html>
